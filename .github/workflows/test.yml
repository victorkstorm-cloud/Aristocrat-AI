name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python train_5090.py --prepare-only --bundled-only
      - name: Decode with the distributed model
        run: python tests/check_release.py
      - name: Install CPU training dependencies
        if: runner.os == 'Linux'
        run: |
          python -m pip install -r requirements-train.txt
          python -m pip install "torch>=2.8,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Train, export, and resume a one-epoch CPU run
        if: runner.os == 'Linux'
        env:
          OMP_NUM_THREADS: "2"
        run: |
          python train_5090.py --smoke --device cpu
          cp run_smoke/benchmark.json "$RUNNER_TEMP/first-benchmark.json"
          python train_5090.py --smoke --device cpu
          cmp "$RUNNER_TEMP/first-benchmark.json" run_smoke/benchmark.json
